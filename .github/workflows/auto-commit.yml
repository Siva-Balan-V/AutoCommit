name: Auto Commit

on:
  schedule:
    - cron: "5 5 * * *"  # 10:35 IST (05:05 UTC)
    - cron: "15 12 * * *" # 17:45 IST (12:15 UTC)
    - cron: "21 18 * * *" # 23:51 IST (18:21 UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  auto-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create or update auto-generated file
        run: |
          mkdir -p generated
          echo "Last updated: $(date -u +"%Y-%m-%d %H:%M:%S UTC")" > generated/heartbeat.txt

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: auto commit $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
          git push
