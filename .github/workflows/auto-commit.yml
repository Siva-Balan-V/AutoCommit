name: Auto Commit

on:
  schedule:
    - cron: "45 4 * * *" # every day at 10:15 AM IST (04:45 UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  auto-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create or update auto-generated file
        run: |
          mkdir -p generated
          echo "Last updated: $(date -u +"%Y-%m-%d %H:%M:%S UTC")" > generated/heartbeat.txt

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add generated/heartbeat.txt
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: auto commit generated update"
          git push
